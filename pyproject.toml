[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-type-contract-enforcer"
version = "0.1.0"
description = "Dynamic type and shape assertion injector verifying function signatures and tensor dimensions at agent runtime"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
runtime-type-contract-enforcer = "runtime_type_contract_enforcer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime_type_contract_enforcer*"]
